---
repos:
  - repo: local
    hooks:
      - id: ansible-lint
        name: ansible-lint (production, offline)
        language: system
        entry: ansible-lint --offline --profile production .
        pass_filenames: false
        types: [yaml]
      - id: ruff
        name: ruff
        language: system
        entry: ruff check
        types: [python]
      - id: mypy
        name: mypy
        language: system
        entry: mypy --package ansible_collections.jomrr.general
        pass_filenames: false
        types: [python]
      - id: pylint
        name: pylint
        language: system
        entry: pylint
        types: [python]
        require_serial: true
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.20.0
    hooks:
      - id: commitizen
        stages:
          - commit-msg
