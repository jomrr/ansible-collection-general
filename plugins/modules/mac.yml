# GNU General Public License v3.0+ (see LICENSE)
DOCUMENTATION:
  module: mac
  short_description: Generate deterministic MAC addresses from a name
  version_added: 0.0.1
  description: Generate MAC addresses with the C(52:54:) prefix using SHA-256.
  attributes:
    check_mode:
      description: Calculate the same addresses without modifying host state.
      support: full
    diff_mode:
      description: The module calculates addresses and does not modify host state.
      support: none
  options:
    name:
      description: This is the FQDN/name of a guest to generate MAC(s) for.
      required: true
      type: str
    count:
      description: >-
        A positive count generates indexed addresses by hashing <name>-<index>, starting at zero.
        Null or a nonpositive count generates one address by hashing the name directly.
      required: false
      type: int
      default: null
  author:
    - Jonas Mauer (@jomrr)
EXAMPLES: |
  - name: Test MAC generation
    jomrr.general.mac:
      name: test.mauer.in
      count: 1
RETURN:
  original_message:
    description: The original name and count param that was passed in.
    type: list
    elements: raw
    returned: always
    sample:
      - test.mauer.in
      - 2
  message:
    description: The output message that the module generates.
    type: str
    returned: always
    sample: ok
  macs:
    description: The list with the MAC address(es).
    type: list
    elements: str
    returned: always
    sample:
      - 52:54:89:4e:c3:ed
      - 52:54:3c:b6:a8:45
