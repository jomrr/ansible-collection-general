ancestor: null
releases:
  1.0.0:
    changes:
      bugfixes:
        - mac - embed module and lookup documentation in Python to prevent duplicate
          Galaxy entries.
      minor_changes:
        - Add the mac module and lookup plugin with shared SHA-256 address generation
          and the 52:54 prefix.
