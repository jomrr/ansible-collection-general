        - Manage collection metadata, documentation, tooling and workflows through
          Ansible Factory.
        - Return calculated MAC addresses in module check mode without reporting changes.
    fragments:
      - galaxy-documentation.yml
      - mac.yml
    release_date: '2026-10-03'
