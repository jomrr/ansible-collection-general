---
ancestor: null
releases:
  1.0.0:
    changes:
      bugfixes:
        - mac - embed module and lookup documentation in Python to prevent duplicate
          Galaxy entries.
      minor_changes:
        - Add the mac module and lookup plugin with shared SHA-256 address generation
          and the 52:54 prefix.
        - Hash names directly by default; positive module counts generate indexed
          addresses.
        - Install development dependencies directly from pyproject.toml without a
          uv.lock file.
        - License the collection under GPL-3.0-or-later.
        - Manage collection metadata, documentation, tooling and workflows through
          Ansible Factory.
        - Return calculated MAC addresses in module check mode without reporting changes.
    fragments:
      - galaxy-documentation.yml
      - mac.yml
    release_date: '2026-10-03'
  1.1.0:
    changes:
      minor_changes:
        - repo - resolve desired repository declarations and caller-supplied presets.
        - repo_apt - manage selected APT sources with a strict, dependency-free DEB822
          parser.
        - repo_rpm - manage DNF, DNF5 and Zypper sections while preserving unrelated
          configuration.
    fragments:
      - repo.yml
    modules:
      - description: Manage desired APT sources while preserving unspecified settings
        name: repo_apt
        namespace: ''
      - description: Manage desired DNF and Zypper repository settings
        name: repo_rpm
        namespace: ''
    plugins:
      filter:
        - description: Resolve desired repositories and caller\-supplied presets
          name: repo
          namespace: null
    release_date: '2026-10-04'
