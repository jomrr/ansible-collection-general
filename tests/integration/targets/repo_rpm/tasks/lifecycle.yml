---
- name: Predict RPM mirror and enabled changes
  jomrr.general.repo_rpm:
    path: /tmp/jomrr-general-repo-test/supplied.repo
    name: fixture
    backend: '{{ ''zypper'' if ansible_facts.os_family == ''Suse'' else ''dnf'' }}'
    baseurl:
      - https://mirror.invalid/v2
    enabled: true
  check_mode: true
  register: repo_predicted
- name: Predict an RPM change
  ansible.builtin.assert:
    that:
      - repo_predicted.changed
- name: Run repository verify
  ansible.builtin.include_tasks: verify.yml
- name: Change RPM mirror and enabled state
  jomrr.general.repo_rpm:
    path: /tmp/jomrr-general-repo-test/supplied.repo
    name: fixture
    backend: '{{ ''zypper'' if ansible_facts.os_family == ''Suse'' else ''dnf'' }}'
    baseurl:
      - https://mirror.invalid/v2
    enabled: true
  register: repo_updated
- name: Read updated RPM section
  ansible.builtin.slurp:
    src: /tmp/jomrr-general-repo-test/supplied.repo
  register: repo_updated_text
- name: Apply RPM mirror and enabled changes
  ansible.builtin.assert:
    that:
      - repo_updated.changed
      - '''baseurl=https://mirror.invalid/v2'' in (repo_updated_text.content | b64decode)'
      - '''enabled=1'' in (repo_updated_text.content | b64decode)'
- name: Remove a section with a sibling
  jomrr.general.repo_rpm:
    path: /tmp/jomrr-general-repo-test/supplied.repo
    name: fixture
    backend: '{{ ''zypper'' if ansible_facts.os_family == ''Suse'' else ''dnf'' }}'
    state: absent
- name: Read surviving sibling
  ansible.builtin.slurp:
    src: /tmp/jomrr-general-repo-test/supplied.repo
  register: repo_sibling
- name: Keep the sibling and its comment
  ansible.builtin.assert:
    that:
      - '''[fixture]'' not in (repo_sibling.content | b64decode)'
      - '''# sibling comment\n[sibling]\nname=Sibling'' in (repo_sibling.content | b64decode)'
- name: Remove the last RPM section
  jomrr.general.repo_rpm:
    path: /tmp/jomrr-general-repo-test/new.repo
    name: new
    backend: '{{ ''zypper'' if ansible_facts.os_family == ''Suse'' else ''dnf'' }}'
    baseurl: &id001
      - https://mirror.invalid/new
    enabled: false
    state: absent
  register: repo_removed
- name: Repeat removal
  jomrr.general.repo_rpm:
    path: /tmp/jomrr-general-repo-test/new.repo
    name: new
    backend: '{{ ''zypper'' if ansible_facts.os_family == ''Suse'' else ''dnf'' }}'
    baseurl: *id001
    enabled: false
    state: absent
  register: repo_absent
- name: Inspect removed RPM file
  ansible.builtin.stat:
    path: /tmp/jomrr-general-repo-test/new.repo
  register: repo_missing
- name: Remove the file exactly once
  ansible.builtin.assert:
    that:
      - repo_removed.changed
      - not repo_absent.changed
      - not repo_missing.stat.exists
- name: Run repository invalid
  ansible.builtin.include_tasks: invalid.yml
- name: Run repository native
  ansible.builtin.include_tasks: native.yml
