---
- name: Repository module converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Run repository ../../../tests/integration/targets/repo_apt/tasks/converge
      ansible.builtin.include_tasks: ../../../tests/integration/targets/repo_apt/tasks/converge.yml
      when: ansible_facts.os_family == 'Debian'
    - name: Run repository ../../../tests/integration/targets/repo_rpm/tasks/converge
      ansible.builtin.include_tasks: ../../../tests/integration/targets/repo_rpm/tasks/converge.yml
      when: ansible_facts.os_family in ['RedHat', 'Suse']
