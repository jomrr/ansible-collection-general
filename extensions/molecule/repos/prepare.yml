---
- name: Repository module prepare
  hosts: all
  gather_facts: true
  tasks:
    - name: Run repository ../../../tests/integration/targets/filter_repo/tasks/main
      ansible.builtin.include_tasks: ../../../tests/integration/targets/filter_repo/tasks/main.yml
    - name: Run repository ../../../tests/integration/targets/repo_apt/tasks/setup
      ansible.builtin.include_tasks: ../../../tests/integration/targets/repo_apt/tasks/setup.yml
      when: ansible_facts.os_family == 'Debian'
    - name: Run repository ../../../tests/integration/targets/repo_rpm/tasks/setup
      ansible.builtin.include_tasks: ../../../tests/integration/targets/repo_rpm/tasks/setup.yml
      when: ansible_facts.os_family in ['RedHat', 'Suse']
